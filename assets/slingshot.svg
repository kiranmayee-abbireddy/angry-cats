<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="120" height="200">
  <defs>
    <!-- Wood Texture Linear Gradient -->
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e2e13"/>
      <stop offset="25%" stop-color="#7c4a21"/>
      <stop offset="50%" stop-color="#a06330"/>
      <stop offset="75%" stop-color="#7c4a21"/>
      <stop offset="100%" stop-color="#3d210b"/>
    </linearGradient>

    <!-- Fork Shading Gradient -->
    <linearGradient id="forkHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8743b"/>
      <stop offset="60%" stop-color="#7c4a21"/>
      <stop offset="100%" stop-color="#4a2a0f"/>
    </linearGradient>

    <!-- Leather Pouch Gradient -->
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#783d19"/>
      <stop offset="100%" stop-color="#3b1c09"/>
    </linearGradient>

    <!-- Slingshot Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base Wooden Pillar -->
    <path d="M 46 95 L 44 190 Q 60 196 76 190 L 74 95 Z" fill="url(#woodGradient)" stroke="#261205" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Bark Texture Grain Lines -->
    <path d="M 52 105 Q 56 140 50 180" stroke="#361a08" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 64 100 Q 60 135 66 185" stroke="#8c5225" stroke-width="2" fill="none" opacity="0.5"/>

    <!-- Left Fork Branch -->
    <path d="M 48 98 C 42 75 22 55 16 15 C 24 12 36 14 42 22 C 48 45 56 70 60 95 Z" fill="url(#forkHighlight)" stroke="#261205" stroke-width="4" stroke-linejoin="round"/>

    <!-- Right Fork Branch -->
    <path d="M 72 98 C 78 75 98 55 104 15 C 96 12 84 14 78 22 C 72 45 64 70 60 95 Z" fill="url(#forkHighlight)" stroke="#261205" stroke-width="4" stroke-linejoin="round"/>

    <!-- Left Prong Leather Strap Joint -->
    <rect x="12" y="10" width="28" height="14" rx="4" fill="#3a1e0b" stroke="#1a0b03" stroke-width="2"/>
    <circle cx="26" cy="17" r="3" fill="#d4af37" stroke="#1a0b03" stroke-width="1"/>

    <!-- Right Prong Leather Strap Joint -->
    <rect x="80" y="10" width="28" height="14" rx="4" fill="#3a1e0b" stroke="#1a0b03" stroke-width="2"/>
    <circle cx="94" cy="17" r="3" fill="#d4af37" stroke="#1a0b03" stroke-width="1"/>
  </g>
</svg>
